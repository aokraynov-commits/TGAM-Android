[project]
name = "tgam-monitor"
version = "4.2.0"
description = "Мониторинг нейроинтерфейса MindWave (TGAM)"
requires-python = ">=3.8"
dependencies = [
    "pyserial",
]

[project.scripts]
tgam-monitor = "tgam_monitor.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:libtmux"

[tool.setuptools.packages.find]
include = ["tgam_monitor*"]
